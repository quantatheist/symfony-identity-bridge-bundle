# Example for config/packages/drenso_oidc.yaml (Symfony 8.1 or existing Drenso apps).
# Default Drenso/Symfony web callback: /login_check. Do not override by default.
drenso_oidc:
    clients:
        default:
            well_known_url: '%env(OIDC_WELL_KNOWN_URL)%'
            client_id: '%env(OIDC_CLIENT_ID)%'
            client_secret: '%env(OIDC_CLIENT_SECRET)%'
            code_challenge_method: S256
            disable_nonce: false
            # Default: redirect_route: /login_check

# config/packages/security.yaml FRAGMENT (merge with existing security.yaml):
